# Android 构建属性。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# skedaddle 仓库根（android/ 的上一级）。CMakeLists 默认也能靠相对路径
# 自动找到（cpp 目录向上 5 级），这里显式给定最稳。
# 若把 android/ 拷到别处，改这一项即可。
SKEDADDLE_SRC_ROOT=../../..

# aarch64 Linux 宿主专用：aapt2 是 x86_64 二进制，经 box64 翻译执行。
# ⚠ 实测（AGP 8.1.4）：路径不存在时 AGP **不会**回退 maven aapt2，而是直接报
#   "Custom AAPT2 location does not point to an AAPT2 executable" 并中止配置。
#   所以 x86_64 宿主（Windows / 普通 Linux）必须用 -P 覆盖成本机 SDK 的 aapt2：
#   ./gradlew -Pandroid.aapt2FromMavenOverride=<SDK>/build-tools/34.0.0/aapt2.exe :app:assembleDebug
#   详见 docs/android.md §5.2。
android.aapt2FromMavenOverride=/home/along/tools/android/bin/aapt2
