# Android 构建属性。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# skedaddle 仓库根（android/ 的上一级）。CMakeLists 默认也能靠相对路径
# 自动找到（cpp 目录向上 5 级），这里显式给定最稳。
# 若把 android/ 拷到别处，改这一项即可。
SKEDADDLE_SRC_ROOT=../../..

# aarch64 Linux 宿主专用：aapt2 是 x86_64 二进制，经 box64 翻译执行。
# x86_64 宿主（Windows 等）忽略本行也不受影响（不存在该路径时 AGP 不会用它，
# 但注意：路径不存在时 AGP 会回退 maven aapt2——Windows 上同样正常）。
android.aapt2FromMavenOverride=/home/along/tools/android/bin/aapt2
